<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Roca de Vida · Alabanza</title>
  <meta name="description" content="Alabanza y Discipulado: muro, canciones, ensayos, devocionales y mentorías.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Alabanza">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Tema guardado (auto / claro / oscuro) antes de pintar, para evitar parpadeo
    try { var t = (JSON.parse(localStorage.getItem('alabanza.ajustes')) || {}).tema; if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="offline" class="offline" hidden>📴 Sin conexión · mostrando lo guardado en tu celular</div>
  <div id="app">
    <div class="cargando"><img src="icons/logo.png" alt="" class="logo-pulso"></div>
  </div>

  <nav id="nav" class="nav" hidden>
    <a href="#/muro" data-tab="muro"><span class="ico">📣</span><span>Muro</span></a>
    <a href="#/mis" data-tab="mis"><span class="ico">🙋</span><span>Mis días</span><b id="badgeMis" class="badge" hidden></b></a>
    <a href="#/canciones" data-tab="canciones"><span class="ico">🎵</span><span>Canciones</span></a>
    <a href="#/agenda" data-tab="agenda"><span class="ico">📅</span><span>Agenda</span></a>
    <a href="#/equipo" data-tab="equipo"><span class="ico">👥</span><span>Equipo</span><b id="badgePend" class="badge" hidden></b></a>
  </nav>

  <nav id="navD" class="nav" hidden aria-label="Discipulado">
    <a href="#/d/inicio" data-tab="inicio"><span class="ico">🏠</span><span>Inicio</span></a>
    <a href="#/d/devocional" data-tab="devocional"><span class="ico">📖</span><span>Devocional</span></a>
    <a href="#/d/muro" data-tab="muro"><span class="ico">💬</span><span>Muro</span></a>
    <a href="#/d/retos" data-tab="retos"><span class="ico">🎯</span><span>Retos</span></a>
    <a href="#/d/mentorias" data-tab="mentorias"><span class="ico">🤝</span><span>Mentorías</span></a>
  </nav>

  <dialog id="modal"><div id="modalBody"></div></dialog>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Al volver a la app se revisa si hay versión nueva. Si la hay, sale un aviso para actualizar
      // (no se recarga solo, para no borrar algo que la persona esté escribiendo).
      var habiaVersion = !!navigator.serviceWorker.controller;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
          document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update().catch(function () {}); });
        }).catch(function () {});
      });
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!habiaVersion) { habiaVersion = true; return; }
        if (document.getElementById('avisoVersion')) return;
        var b = document.createElement('button');
        b.id = 'avisoVersion'; b.className = 'aviso-version'; b.type = 'button';
        b.textContent = '✨ Hay una versión nueva · Toca para actualizar';
        b.onclick = function () { location.reload(); };
        document.body.appendChild(b);
      });
    }
  </script>
</body>
</html>
